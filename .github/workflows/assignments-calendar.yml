name: Assignments calendar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if ! gh project item-list 3 --owner Wespiseb --format json --limit 200 > items.json; then
            echo '{"items":[]}' > items.json
          fi

      - name: Build calendar
        env:
          ICS_PATH: calendar/assignments-k7Qm2xv9Rt4pLw8d.ics
        run: python3 scripts/make_ics.py

      - name: Commit changes
        run: |
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A calendar
          if ! git diff --cached --quiet; then
            git commit -m "Update assignments calendar"
            git push origin HEAD:main
          fi
